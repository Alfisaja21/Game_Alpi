<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werewolf Game Alpi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>🐺 Werewolf</h1>
<p>AI Moderator • Party Game</p>

<section class="card">
<h2 id="title">Desa Menunggu</h2>
<p id="story">Tekan mulai untuk memulai permainan.</p>
<button onclick="startGame()">Mulai Game</button>
<button onclick="showRole()">👁 Lihat Role</button>
<div id="role" class="role hide"></div>
</section>

<section class="card">
<h3>Pengaturan</h3>
<select id="tts">
<option value="on">TTS Moderator Aktif</option>
<option value="off">TTS Mati</option>
</select>
</section>

<section class="card">
<h3>Profil</h3>
<p id="profile"></p>
</section>

</main>
<script src="script.js"></script>
</body>
</html>

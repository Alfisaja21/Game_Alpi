<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Alpi - Werewolf</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<section id="home" class="screen active">
    <div class="moon">🌕</div>
    <h1>Werewolf</h1>
    <p>Desa Alpi memasuki malam yang gelap.</p>

    <input id="playerName" placeholder="Nama pemain">

    <button id="createBtn">🐺 CREATE ROOM</button>
    <button id="joinBtn" class="secondary">👥 JOIN ROOM</button>
</section>

<section id="lobby" class="screen">
    <h2>Lobby</h2>
    <div class="room">
        Room Code:
        <strong id="roomCode">----</strong>
    </div>

    <h3>Players</h3>
    <div id="players"></div>

    <button id="startBtn">START GAME</button>
</section>

<section id="game" class="screen">
    <h2 id="phase">Waiting...</h2>
    <div id="roleCard" class="role">
        Role belum diberikan
    </div>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap Target</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <p class="eyebrow">GAME LATIHAN HOSTING</p>
      <h1>Game Pertamaku</h1>
      <p class="subtitle">Klik lingkaran sebanyak mungkin dalam 20 detik.</p>

      <div class="stats">
        <div class="stat">
          <span>Skor</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>Waktu</span>
          <strong><span id="time">20</span>s</strong>
        </div>
        <div class="stat">
          <span>Terbaik</span>
          <strong id="bestScore">0</strong>
        </div>
      </div>

      <div id="gameArea" class="game-area" aria-label="Area permainan">
        <div id="startMessage" class="start-message">
          <div class="emoji">🎯</div>
          <h2>Siap bermain?</h2>
          <p>Tekan tombol mulai, lalu tap target yang muncul.</p>
        </div>
        <button id="target" class="target" aria-label="Target"></button>
      </div>

      <button id="startBtn" class="start-btn">Mulai Game</button>
      <p id="result" class="result"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
